<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 레이아웃: 왼쪽 사이드바, 오른쪽 지도 */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* 사이드바 스타일 */
        #sidebar {
            width: 300px;
            height: 100%;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .search-box {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .item:hover {
            background-color: #e9ecef;
        }

        /* 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <div class="search-box">
            <h2>장소 검색</h2>
            <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)">
        </div>
        <ul id="result-list">
            </ul>
    </div>

    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8ec585b7c53b6c659ceb97f1660073a7&libraries=services"></script>

<script>
    const mapContainer = document.getElementById('map'); // 지도를 표시할 div
    const mapOption = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 좌표(서울시청)
        level: 5 // 확대 레벨
    };

    // 지도 객체 생성
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // 장소 검색 객체 생성
    const ps = new kakao.maps.services.Places();

    // 1. 현재 위치 가져오기
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude; // 위도
            const lon = position.coords.longitude; // 경도
            
            const currentPos = new kakao.maps.LatLng(lat, lon);

            // 지도 중심을 현재 위치로 이동
            map.setCenter(currentPos);

            // 현재 위치에 마커 표시
            const marker = new kakao.maps.Marker({
                position: currentPos
            });
            marker.setMap(map);
        }, function(error) {
            alert("위치 권한을 허용해주셔야 현재 위치 기능을 사용할 수 있습니다.");
        });
    }

    // 2. 키워드 검색 기능 (Enter 키 이벤트)
    const keywordInput = document.getElementById('keyword');
    keywordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const value = keywordInput.value;
            if (!value.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return;
            }
            // 장소 검색 실행
            ps.keywordSearch(value, placesSearchCB);
        }
    });

    // 3. 검색 결과 콜백 함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 4. 결과 리스트 출력 및 마커 표시
    function displayPlaces(places) {
        const listEl = document.getElementById('result-list');
        const bounds = new kakao.maps.LatLngBounds();
        
        // 이전 검색 결과 삭제
        listEl.innerHTML = '';

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const marker = new kakao.maps.Marker({
                position: placePosition
            });

            marker.setMap(map); // 지도에 마커 추가
            bounds.extend(placePosition); // 지도 범위 조절을 위한 좌표 추가

            // 리스트 아이템 추가
            const itemEl = document.createElement('li');
            itemEl.className = 'item';
            itemEl.innerHTML = `<strong>${places[i].place_name}</strong><br><small>${places[i].address_name}</small>`;
            
            // 리스트 클릭 시 해당 위치로 지도 이동
            itemEl.onclick = function() {
                map.panTo(placePosition);
            };

            listEl.appendChild(itemEl);
        }

        // 검색된 장소들이 다 보이도록 지도 범위 재설정
        map.setBounds(bounds);
    }
</script>

</body>
</html>
